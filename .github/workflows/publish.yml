name: Publish packages

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for integration tests
        run: npx playwright install --with-deps chromium

      - name: Verify release version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Verify repository
        run: npm run check

      - name: Inspect package contents
        run: |
          npm pack --dry-run --workspace=packages/browser-sdk
          npm pack --dry-run --workspace=packages/browser-sdk-mcp

      - name: Publish missing versions
        run: |
          publish_if_new() {
            local package_dir="$1"
            (
              cd "$package_dir"
              local package_name
              package_name=$(node -p "require('./package.json').name")
              local package_version
              package_version=$(node -p "require('./package.json').version")
              if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
                echo "::notice ::${package_name}@${package_version} is already published; skipping."
              else
                npm publish --access public --provenance
              fi
            )
          }

          publish_if_new packages/browser-sdk
          publish_if_new packages/browser-sdk-mcp
